apiVersion: apps/v1
kind: Deployment
metadata:
  name: herkey-devops-assignment-deployment
  labels:
    app: herkey-flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: herkey-flask-app
  template:
    metadata:
      labels:
        app: herkey-flask-app
    spec:
      containers:
      - name: flask-container
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5